name: Trigger FE build

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to studio-foto-fe
        env:
          GH_TOKEN: ${{ secrets.FE_DISPATCH_TOKEN }}
        run: |
          gh api repos/kmalon/studio-foto-fe/dispatches \
            -f event_type=assets-updated \
            -F client_payload[sha]=${{ github.sha }} \
            -F client_payload[ref]=${{ github.ref }}
